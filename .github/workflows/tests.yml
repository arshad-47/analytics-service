# What this workflow runs: the whole pytest suite of the service (tests/, without the old harness tests/unit_testing.py,
# which rewrites the tracked tests/TEST_CASES.csv, and without tests/test_hf_thematic.py, which needs the Hugging Face
# models) on Python 3.10 (the Dockerfile's version), with the dependencies of the image (requirements-prod.txt) plus
# pytest, httpx and json5. A postgres:16 service container is started so the opt-in real-Postgres tests
# (tests/test_*_pg.py and the database parts of a few other files) really run; a second step then fails the job if any
# of them was skipped. No secret, LLM, Kafka, Temporal or cloud storage is used: tests/conftest.py sets every setting
# the tests read before the app is imported.
name: tests

# Runs on every pull request and on pushes to the main and release branches. tests/pg_support.py creates one scratch
# database per test module on the service container below (FEEDBACK_TEST_DATABASE_URL names the SERVER only) and drops
# it afterwards.
on:
  pull_request:
  push:
    branches: [main, "release-*"]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # a normal run is about 4 to 6 minutes (mostly the dependency install); this stops a hang early

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # a Postgres SERVER (the postgres role is a superuser, so it can CREATE DATABASE); the tests never modify the
      # database this URL names, they create and drop scratch_pg_* databases next to it
      FEEDBACK_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # every other setting the tests need is set by tests/conftest.py before the app is imported
      # With the Postgres server reachable no test is skipped (measured: 0 of ~2400); without it every skip is a
      # Postgres one (~340). The job therefore allows no skip at all.
      MAX_SKIPPED_TESTS: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-prod.txt

      # the image's own requirements (Dockerfile) plus what the tests import and requirements.txt already lists
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install "pytest>=8.0.0" "pytest-xdist>=3.5.0" "httpx>=0.24.0" "json5>=0.14.0"

      - name: Run the tests
        # -n auto --dist loadfile: one worker per CPU, every test file stays on one worker (the per-file scratch
        # databases of tests/pg_support.py are created and dropped by that worker). Measured on a laptop with the
        # Postgres tests: 63 s serial, 26 s with 4 workers.
        run: >-
          pytest tests -q -n auto --dist loadfile
          --ignore=tests/unit_testing.py --ignore=tests/test_hf_thematic.py
          -p no:cacheprovider -rs --durations=10 --junitxml=junit.xml

      # a green run in which the Postgres tests silently skipped would prove nothing
      - name: Assert the Postgres tests really ran
        if: always()
        run: |
          python - <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET
          if not os.path.exists("junit.xml"):
              sys.exit("junit.xml was not written: pytest did not finish (see the previous step)")
          root = ET.parse("junit.xml").getroot()
          cases = list(root.iter("testcase"))
          # an expected failure (xfail) is reported by pytest as a <skipped type="pytest.xfail">: it is not a skip
          skipped = [c for c in cases if c.find("skipped") is not None and c.find("skipped").get("type") != "pytest.xfail"]
          pg = [c for c in cases if "_pg" in c.get("classname", "") and c.find("skipped") is None]
          limit = int(os.environ["MAX_SKIPPED_TESTS"])
          print(f"{len(cases)} tests, {len(skipped)} skipped (allowed: {limit}), {len(pg)} ran in *_pg modules")
          if len(skipped) > limit:
              sys.exit("too many skipped tests: the real-Postgres tests did not run")
          if len(pg) == 0:
              sys.exit("no test of a *_pg module ran")
          PY
